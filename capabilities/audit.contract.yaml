id: cap.consult.digital_audit
purpose: Mengubah bukti halaman menjadi temuan audit yang dapat ditelusuri.
input_schema:
  required: [intake_brief, page_evidence, audit_scope]
  properties: {intake_brief: object, page_evidence: "array[object]", audit_scope: "array[string]"}
preconditions: [Setiap temuan memiliki URL bukti dan confidence, Pisahkan observasi inferensi dan hal yang belum diuji, Error tooling bukan otomatis temuan situs]
execution_contract: [Pisahkan Temuan Situs dari Catatan Pengembangan ADC, Setiap temuan memuat severity evidence_urls confidence evidence_level dan unknowns, Metadata yang belum diperiksa ditandai UNKNOWN]
output_schema:
  required: [site_findings, adc_development_notes, unknowns, limitations]
  properties: {site_findings: "array[object]", adc_development_notes: "array[object]", unknowns: "array[string]", limitations: "array[string]"}
failure_modes: [missing_evidence_url, unsupported_claim, confidence_missing, tooling_error_misclassified_as_site_finding, scope_overreach]
authority_required: [Hanya gunakan bukti dalam ruang lingkup disetujui, Tinjauan manusia sebelum laporan klien final]
