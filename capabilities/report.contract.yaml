id: report
version: "0.1"
purpose: Produce a client-reviewable digital audit and roadmap report.
inputs:
  required: [audit_findings, prioritized_actions, sources, limitations]
outputs:
  required: [executive_summary, evidence_based_findings, roadmap, assumptions, sources]
constraints:
  - Write in Indonesian by default.
  - Distinguish verified findings, inference, and unknowns.
  - Drafting does not authorize sending the report to a client.
failure_cases:
  - missing_source_list
  - unsupported_claim
acceptance: "A human reviewer can identify evidence, caveats, and next actions."
